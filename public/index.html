<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Image Repository</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <header class="glass bar">
    <h1>Image Repository</h1>
    <span class="count" id="count"></span>
  </header>

  <main class="glass frame">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No images yet. Add some to public/images.</p>
  </main>

  <div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""></div>

  <script src="app.js"></script>
</body>
</html>
